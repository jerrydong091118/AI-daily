name: AI Daily - 自动生成日报

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests markdown openai

      - name: 抓取 RSS 资讯
        run: python fetcher/rss_fetcher.py

      - name: 生成新手解读
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/beginner_note.py

      - name: 生成日报 HTML
        run: python scripts/html_generator.py

      - name: 提交更新到 main 分支（触发 Vercel 自动部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/index.html
          git diff --cached --quiet || (git commit -m "📰 每日更新 $(date +%Y-%m-%d)" && git push)

      - name: 整理发布文件
        run: |
          mkdir -p _site
          cp output/index.html _site/

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
